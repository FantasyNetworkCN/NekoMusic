# =============================================
# Neko云音乐后端配置文件
# =============================================

# =============================================
# 服务器配置
# =============================================
# 运行端口
# 示例：8080, 9999, 3000
port: 65535

# 高并发调优（可选；缺省为下列值，请与 MySQL max_connections 等一起规划）
performance:
  jetty_max_threads: 200
  jetty_min_threads: 10
  jetty_idle_timeout_ms: 60000
  hikari_maximum_pool_size: 20
  hikari_minimum_idle: 5

# =============================================
# MySQL 数据库配置
# =============================================
mysql:
  # 数据库主机地址
  # 示例：127.0.0.1, localhost, 192.168.1.100
  host: 127.0.0.1

  # 数据库端口
  # 示例：3306 (MySQL 默认端口)
  port: 3306

  # 数据库名称
  # 示例：neko_music, music_db
  database: neko_music

  # 数据库用户名
  # 示例：root, admin, neko_user
  username: root

  # 数据库密码
  # 注意：生产环境请使用强密码
  password: wcjs123

# =============================================
# Redis 配置
# =============================================
redis:
  # Redis 主机地址
  # 示例：127.0.0.1, localhost, 192.168.1.100
  host: 127.0.0.1

  # Redis 端口
  # 示例：6379 (Redis 默认端口)
  port: 6379

  # Redis 密码
  # 如果 Redis 不需要密码，留空即可
  # 示例：your_redis_password
  password: ""

  # Lettuce 连接池上限（建议不小于 Jetty 峰值并发下会打 Redis 的线程数）
  pool_max_total: 32

# =============================================
# Hook 消息配置（可选）
# =============================================
# 用于接收系统通知和告警消息
# 插件地址：https://github.com/MinecraftNekoServer/astrbot_msg_hook
Msg:
  # Hook 服务 URL
  # 示例：http://127.0.0.1:8080, http://192.168.1.100:8080
  url: 127.0.0.1:8080

  # Hook 服务 Token
  # 用于验证请求的合法性
  # 示例：my_secret_token, Fantasy_Network
  token: Fantasy_Network

# =============================================
# JWT 配置
# =============================================
jwt:
  # JWT 密钥
  # 注意：生产环境请使用强随机字符串，至少 32 位
  # 示例：mySuperSecretKey123456789012345
  secret: defaultSecretKeyForNekoMusic

  # Token 过期时间（秒）
  # 示例：3600 (1小时), 86400 (24小时), 604800 (7天)
  expiration: 86400  # 24小时

# =============================================
# 邮件服务器配置
# =============================================
smtp:
  # SMTP 服务器地址
  # 常用示例：
  #   - QQ企业邮箱：smtp.exmail.qq.com
  #   - QQ邮箱：smtp.qq.com
  #   - Gmail：smtp.gmail.com
  #   - 163邮箱：smtp.163.com
  host: smtp.exmail.qq.com

  # SMTP 服务器端口
  # 常用端口：
  #   - 465 (SSL)
  #   - 587 (TLS)
  #   - 25 (不加密，不推荐)
  port: 465

  # SMTP 用户名
  # 通常是完整的邮箱地址
  # 示例：support@cnmsb.xin, admin@example.com
  username: support@cnmsb.xin

  # SMTP 密码
  # 注意：某些邮箱需要使用授权码而非登录密码
  password: 7fnFaXso2ccRHmLL

  # 是否启用 SSL
  # 示例：true (推荐), false
  ssl: true

  # 是否启用 TLS
  # 示例：true, false
  tls: false

# =============================================
# 邮箱白名单配置
# =============================================
# 只允许这些邮箱域名的用户注册
# 留空表示允许所有邮箱域名注册
whitelist_email:
  # 示例邮箱域名
  # - qq.com
  # - gmail.com
  # - outlook.com
  # - 163.com
  # - example.com
  - qq.com
  - gmail.com

# =============================================
# IP 频率限制配置（安全防护）
# =============================================
# 按 /24 网段（a.b.c.*）聚合计数与封锁，减轻 NAT 下误伤，又比 /16 更精细
# 示例：192.168.1.10 与 192.168.1.200 同属 192.168.1.0/24；192.168.2.1 属于另一段
rate_limit:
  # 是否启用 IP 频率限制
  # 示例：true (启用), false (禁用)
  enabled: false

  # 时间窗口（秒）
  # 在此时间窗口内统计请求数，超过限制后封锁网段
  # 示例：60 (1分钟), 300 (5分钟), 3600 (1小时)
  time_window: 60

  # 最大请求数
  # 同一 /24 网段在时间窗口内的最大请求次数
  # 示例：10, 20, 50
  # 建议：生产环境设置为 10-20，开发环境可设为 100
  max_requests: 50

  # 封锁时间（秒）
  # 超过限制后，该网段将被封锁的时间
  # 示例：3600 (1小时), 7200 (2小时), 86400 (1天)
  block_duration: 3600

  # 是否静默超时
  # true: 对超频请求不返回任何响应，让对方自己 timeout（更安全）
  # false: 返回错误信息给用户
  # 示例：true (推荐), false
  silent_timeout: true

# =============================================
# 横屏短视频渲染（FFmpeg，独立线程池异步执行）
# =============================================
# 用户在播放页发起「生成分享视频」，服务端异步合成 1920×1080 MP4（封面 + 波形 + 标题/艺术家字幕）。
# 成片目录：/tmp/NekoMusic-video-render/{jobId}.mp4
# 公开 API（需登录）：
#   POST /api/video/render/create   body: { "musicId": 1, "startSec": 0 }
#   GET  /api/video/render/{jobId}    轮询 pending → processing → done / failed
#   GET  /api/video/render/{jobId}/download
# 会员策略：
#   非 VIP：最长 non_vip_max_duration_sec 秒、带内嵌 watermark.png 水印、每日 non_vip_daily_limit 次（Redis 计数）
#   VIP：整首时长（从 startSec 到曲末）、无水印、不限次数
# 内嵌 FFmpeg：打包时已打入 JAR（resources/native/linux-x86_64/ffmpeg，仅 Linux amd64）
video_render:
  # 是否启用视频生成功能
  # 示例：true (启用), false (关闭，接口返回 503)
  enabled: true

  # FFmpeg 可执行文件路径
  # auto 或 ffmpeg：自动解析（优先 JAR 内嵌 → /usr/bin/ffmpeg 等）
  # 也可填绝对路径，例如 /usr/bin/ffmpeg
  ffmpeg_path: auto

  # 为 true 时优先使用 JAR 内嵌 FFmpeg（推荐；避免 systemd 等环境 PATH 过短找不到命令）
  # 为 false 时先找系统 PATH / 常见路径，再找内嵌包
  prefer_bundled_ffmpeg: true

  # 非 VIP 单次成片最长秒数（VIP 不受此项限制，按歌曲剩余时长）
  # 示例：15, 30
  non_vip_max_duration_sec: 15

  # 非 VIP 每自然日（东八区）最多生成次数，依赖 Redis
  # 示例：10, 20
  non_vip_daily_limit: 10

  # 后台渲染线程数（队列满时新任务返回 503）
  # 示例：1, 2, 4
  worker_threads: 20

  # 渲染完成邮件中的站点根（不含尾斜杠），用于拼接下载 API
  # 示例：https://music.cnmsb.xin → …/api/video/render/{jobId}/download（无需登录）
  # 未填则从 zpay.frontend_return_url 推断（去掉 /vip）
  notify_frontend_base_url: "https://music.cnmsb.xin"

# =============================================
# ZPay 支付（易支付兼容 API，文档 https://z-pay.cn/doc.html）
# =============================================
# notify_url = public_base_url + /api/payment/zpay/notify（须公网 HTTPS，无查询参数）
# 当前域名下完整异步地址示例：https://music.cnmsb.xin/api/payment/zpay/notify
# return_url：未填 frontend_return_url 时默认为 public_base_url + /vip
# pid、key 仅填你在 ZPay 商户后台拿到的值；切勿把 key 提交到公开仓库。
# 仅使用 mapi.php（API 接口支付），不使用 submit.php 页面跳转。
zpay:
  enabled: true
  pid: "2025110723453452"
  key: "2AmiPprT4D1d7Eyi5DNFNsi1BdnqFYPR"
  mapi_url: "https://zpayz.cn/mapi.php"
  public_base_url: "https://music.cnmsb.xin/api/payment/zpay/notify"
  frontend_return_url: "https://music.cnmsb.xin/vip"
